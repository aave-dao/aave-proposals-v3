[profile.default]
src = 'src'
test = 'tests'
script = 'scripts'
solc = '0.8.28'
optimizer = true
optimizer_runs = 200
out = 'out/shanghai'
bytecode_hash = 'none'
libs = ['lib']
remappings = []
ffi = true
fs_permissions = [
  { access = "read-write", path = "./reports" },
  { access = "read", path = "./zkout" },
  { access = "read-write", path = "./diffs" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./snapshot" },
]
evm_version = 'shanghai'
cache_path = 'cache/shanghai'

[profile.zksync]
src = 'zksync'
test = 'zksync'
libs = ['lib']
solc = '0.8.27'
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "./reports" },
  { access = "read-write", path = "./diffs" },
  { access = "read", path = "./zkout" },
  { access = "read", path = "./out" },
]
ffi = true
out = 'out/shanghai'
evm_version = 'shanghai'
cache_path = 'cache/shanghai'

[profile.zksync.zksync]
bytecode_hash = 'none'
compile = true
fallback_oz = true
mode = '3'
zksolc = '1.5.13'

[profile.test]
out = 'out/prague'
evm_version = 'prague'
cache_path = 'cache/prague'
gas_limit = 9223372036854775807

[profile.deploy]
out = 'out/shanghai'
evm_version = 'shanghai'
cache_path = 'cache/shanghai'

# Fixed seed so vm.random* in tests is reproducible across runs.
[fuzz]
seed = '0x4242'

[lint]
lint_on_build = false

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
optimism = "${RPC_OPTIMISM}"
avalanche = "${RPC_AVALANCHE}"
polygon = "${RPC_POLYGON}"
arbitrum = "${RPC_ARBITRUM}"
fantom = "${RPC_FANTOM}"
harmony = "${RPC_HARMONY}"
metis = "${RPC_METIS}"
base = "${RPC_BASE}"
zkevm = "${RPC_ZKEVM}"
gnosis = "${RPC_GNOSIS}"
bnb = "${RPC_BNB}"
scroll = "${RPC_SCROLL}"
zksync = "${RPC_ZKSYNC}"
linea = "${RPC_LINEA}"
celo = "${RPC_CELO}"
sonic = "${RPC_SONIC}"
soneium = "${RPC_SONEIUM}"
ink = "${RPC_INK}"
plasma = "${RPC_PLASMA}"
mantle = "${RPC_MANTLE}"
xlayer = "${RPC_XLAYER}"
megaeth = "${RPC_MEGAETH}"
monad = "${RPC_MONAD}"
mainnet_virtual = "${RPC_TENDERLY_VIRTUAL_MAINNET}"
arbitrum_virtual = "${RPC_TENDERLY_VIRTUAL_ARBITRUM}"
monad_virtual = "${RPC_TENDERLY_VIRTUAL_MONAD}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
