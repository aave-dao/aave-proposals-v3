name: Test

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Enforce linting
        run: pnpm lint

  test-sol:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # the PR merge commit and its first parent, the base branch the risk params check diffs against
          fetch-depth: 2

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # we simply use foundry zk for all jobs in this repo
      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "nightly"

      - name: Run Forge tests
        id: test
        uses: aave-dao/github-workflows/.github/actions/foundry-test@main
        with:
          MODE: "CHANGED"
          FOUNDRY_PROFILE: "test"

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main
        if: github.event_name == 'pull_request'

      # proposals generated from a risk params record: record revision, record vs config vs payload,
      # and record vs the fork snapshots of the tests above; runs a proposal test if it didn't run
      - name: Check risk params records
        id: riskparams
        if: github.event_name == 'pull_request'
        env:
          FOUNDRY_PROFILE: "test"
          PREVIOUS: ${{ github.event.before }}
        run: |
          if [ -n "$PREVIOUS" ]; then git fetch --no-tags --depth=1 origin "$PREVIOUS" || PREVIOUS=""; fi
          status=0
          pnpm -s test:risk-params:check --base HEAD^1 ${PREVIOUS:+--previous "$PREVIOUS"} --testLog /tmp/foundry_test --fork --out /tmp/content/riskParams.txt || status=$?
          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Create comment
        uses: aave-dao/github-workflows/.github/actions/comment-artifact@main

      # we let failing tests pass so we can log them in the comment, still we want the ci to fail
      - name: Post test result
        if: ${{ steps.test.outputs.testStatus != 0 || steps.zktest.outputs.testStatus != 0 || steps.riskparams.outputs.status != 0 }}
        run: |
          echo "tests failed"
          exit 1

  test-codegen:
    name: Generated payloads build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      # the snapshot specs only diff strings, so a payload that does not compile passes
      # them; this builds the generator fixtures with forge
      - name: Build generated payloads
        run: pnpm test:codegen

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      - name: Run tests
        run: pnpm test
